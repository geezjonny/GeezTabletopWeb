<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121a22">
  <title>GeezTabletop · Player map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
  {"imports":{
    "three":"./vendor/three-0.180.0/build/three.module.js",
    "three/addons/":"./vendor/three-0.180.0/examples/jsm/",
    "firebase/app":"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
    "firebase/auth":"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
    "firebase/database":"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
  }}
  </script>
</head>
<body>
  <main id="map" aria-label="3D battle map"></main>
  <header><div class="brand">G<span>◆</span>T <small>PLAYER TABLE</small></div><div id="status" role="status">Loading…</div></header>
  <section id="map-info"><h1 id="title">GeezTabletop</h1><p id="floor">Waiting for a map</p></section>
  <nav aria-label="Map controls"><button id="find">◎ Find me</button><button id="stairs" hidden>Go up</button><button id="identity">Choose PC</button><button id="help" aria-expanded="false">?</button></nav>
  <aside id="instructions" hidden>Drag your token, or select it and tap a cell to move. Right-click or hold a cell to ping. Drag the map to orbit; two fingers to pan and pinch to zoom.</aside>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="picker"><form><p class="eyebrow">TAKE YOUR PLACE</p><h2>Who’s at the table?</h2><label>Your character<select id="pcs"><option value="">Type a name below</option></select></label><label>Player / PC name<input id="player-name" maxlength="80" required autocomplete="nickname" placeholder="Character name"></label><button type="submit">Join the map →</button></form></dialog>
  <section id="handouts" aria-label="Handouts" aria-live="polite"></section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
